        :root {
            /* Light Mode Variables */
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-main: #111827;
            --text-muted: #6b7280;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --input-bg: #f3f4f6;
            --border: #e5e7eb;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            --chart-fill: rgba(37, 99, 235, 0.1);
        }

        [data-theme="dark"] {
            /* Dark Mode Variables */
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #3b82f6;
            --primary-hover: #60a5fa;
            --input-bg: #334155;
            --border: #334155;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            --chart-fill: rgba(59, 130, 246, 0.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        body {
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .calculator-wrapper {
            background: var(--card-bg);
            width: 100%;
            max-width: 1000px;
            border-radius: 20px;
            box-shadow: var(--shadow);
            overflow: hidden;
            border: 1px solid var(--border);
        }

        .calculator-header {
            padding: 24px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
        }

        .header-text h1 {
            color: var(--text-main);
            font-size: 22px;
            font-weight: 700;
        }

        .header-text p {
            color: var(--text-muted);
            font-size: 14px;
            margin-top: 4px;
        }

        /* Dark Mode Toggle Switch */
        .theme-switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 26px;
        }
        .theme-switch input { opacity: 0; width: 0; height: 0; }
        .slider-toggle {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #cbd5e1;
            transition: .4s;
            border-radius: 34px;
        }
        .slider-toggle:before {
            position: absolute;
            content: "☀️";
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 20px;
            width: 20px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }
        input:checked + .slider-toggle { background-color: var(--primary); }
        input:checked + .slider-toggle:before {
            transform: translateX(24px);
            content: "🌙";
            background-color: #1e293b;
        }

        .calculator-grid {
            display: grid;
            grid-template-columns: 1fr 1.2fr;
            gap: 40px;
            padding: 32px;
        }

        .input-group {
            margin-bottom: 28px;
        }

        .label-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .label-row label {
            font-weight: 500;
            color: var(--text-main);
            font-size: 15px;
        }

        .value-display {
            background: var(--input-bg);
            padding: 8px 12px;
            border-radius: 8px;
            font-weight: 600;
            color: var(--primary);
            display: flex;
            align-items: center;
            border: 1px solid var(--border);
        }

        .value-display input {
            border: none;
            background: transparent;
            font-weight: 600;
            color: var(--primary);
            width: 80px;
            text-align: right;
            outline: none;
            font-size: 16px;
        }

        /* Interactive Range Slider */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
            height: 6px;
            border-radius: 4px;
            background-image: linear-gradient(var(--primary), var(--primary));
            background-size: 50% 100%;
            background-repeat: no-repeat;
            cursor: pointer;
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 6px;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 22px;
            width: 22px;
            border-radius: 50%;
            background: var(--primary);
            cursor: pointer;
            margin-top: -8px;
            box-shadow: 0 0 0 4px var(--card-bg), 0 0 0 6px var(--primary);
            transition: transform 0.1s;

        table {

        th, td {

        th {

        .header-actions {
            display: flex;
            align-items: center;
            gap: 16px;

        .action-btn {
            padding: 8px 16px;
            background: var(--input-bg);
            color: var(--text-main);

        .action-btn:hover { background: var(--border); }
        .action-btn svg { fill: var(--text-main); }

        .switch-container {
            display: flex;
            align-items: center;

            margin-top: 10px;
            padding: 12px;
            background: var(--input-bg);

        .switch-container span {

        .social-footer {

            justify-content: center;
            align-items: center;
            gap: 16px;

        .social-link {

            align-items: center;
            gap: 6px;
            font-size: 14px;
            font-weight: 500;

        .social-link:hover {
            color: var(--primary);
        }
        .social-link svg {
            fill: currentColor;
            width: 18px;
            height: 18px;
        }

        @media print {
            body { background: white; padding: 0; }
            .calculator-wrapper { box-shadow: none; border: none; }
            .input-section, .tabs, .header-actions, .social-footer { display: none !important; }
            .calculator-grid { display: block; }
            .output-section { width: 100%; }
            .tab-content { display: block !important; }
            .table-container { max-height: none; overflow: visible; }
            .doughnut-wrapper { break-inside: avoid; margin-top: 30px; }
        }

        @media (max-width: 768px) {
            .calculator-grid { grid-template-columns: 1fr; gap: 24px; }
        }
    </style>
</head>

<script>
    // Theme Toggle Logic
    const themeToggle = document.getElementById('theme-toggle');
    themeToggle.addEventListener('change', (e) => {
        if (e.target.checked) {
            document.body.setAttribute('data-theme', 'dark');
        } else {
            document.body.removeAttribute('data-theme');
        }
        if (donutChart) { donutChart.destroy(); donutChart = null; }
        calculateSIP(); // Redraw chart colors
    });

    // Grab DOM Elements
    const invSlider = document.getElementById('investment-slider');
    const invInput = document.getElementById('investment-input');
    const rateSlider = document.getElementById('return-slider');
    const rateInput = document.getElementById('return-input');
    const timeSlider = document.getElementById('time-slider');
    const timeInput = document.getElementById('time-input');

    const investedAmountEl = document.getElementById('invested-amount');
    const estReturnsEl = document.getElementById('est-returns');
    const totalValueEl = document.getElementById('total-value');
    const milestoneBox = document.getElementById('milestone-box');
    const inflationToggle = document.getElementById('inflation-toggle');
    const currencySelect = document.getElementById('currency-select');
    const currencySymbols = document.querySelectorAll('.currency-symbol');

    let sipChart;
    let donutChart;
    let hasShownConfetti = false;
    let currentCurrency = { symbol: '₹', locale: 'en-IN' };

    inflationToggle.addEventListener('change', calculateSIP);
    currencySelect.addEventListener('change', (e) => {
        const option = e.target.options[e.target.selectedIndex];
        currentCurrency.symbol = option.getAttribute('data-symbol');
        currentCurrency.locale = option.getAttribute('data-locale');
        
        currencySymbols.forEach(el => el.innerText = currentCurrency.symbol + ' ');
        calculateSIP();
    });

    // Tab Switching Logic
    window.switchTab = function(tabId) {
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
        
        event.currentTarget.classList.add('active');
        document.getElementById('tab-' + tabId).classList.add('active');
    };

    // Number Formatter
    const formatCurrency = (num) => {
        return new Intl.NumberFormat(currentCurrency.locale, { maximumFractionDigits: 0 }).format(num);
    };

    const formatCompact = (num) => {
        if (currentCurrency.locale === 'en-IN') {
            if(num >= 10000000) return (num/10000000).toFixed(1) + 'Cr';
            if(num >= 100000) return (num/100000).toFixed(1) + 'L';
        } else {
            if(num >= 1000000) return (num/1000000).toFixed(1) + 'M';
            if(num >= 1000) return (num/1000).toFixed(1) + 'K';
        }
        return num.toString();
    };

    // Animated Number Counter
    function animateValue(obj, start, end, duration) {
        let startTimestamp = null;
        const step = (timestamp) => {
            if (!startTimestamp) startTimestamp = timestamp;
            const progress = Math.min((timestamp - startTimestamp) / duration, 1);
            // Ease out function
            const easeProgress = 1 - Math.pow(1 - progress, 3);
            let currentVal = Math.floor(easeProgress * (end - start) + start);
            obj.innerHTML = `<span class="currency-symbol">${currentCurrency.symbol} </span>` + formatCurrency(currentVal);
            if (progress < 1) {
                window.requestAnimationFrame(step);
            }
        };
        window.requestAnimationFrame(step);
    }

    // Dynamic Slider Background Fill
    function updateSliderFill(slider) {
        const value = (slider.value - slider.min) / (slider.max - slider.min) * 100;
        let trackColor = document.body.getAttribute('data-theme') === 'dark' ? '#334155' : '#e5e7eb';
        slider.style.background = `linear-gradient(to right, var(--primary) ${value}%, ${trackColor} ${value}%)`;
    }

    // Sync Sliders and Inputs
    const syncInputs = (slider, input) => {
        updateSliderFill(slider);
        slider.addEventListener('input', () => {
            input.value = slider.value;
            updateSliderFill(slider);
            calculateSIP();
        });
        input.addEventListener('input', () => {
            slider.value = input.value;
            updateSliderFill(slider);
            calculateSIP();
        });
    };

    syncInputs(invSlider, invInput);
    syncInputs(rateSlider, rateInput);
    syncInputs(timeSlider, timeInput);

    // Globals to prevent restarting animation if value hasn't changed drastically
    let prevInvested = 0, prevReturns = 0, prevTotal = 0;

    function calculateSIP() {
        let P = parseFloat(invInput.value);
        let R = parseFloat(rateInput.value);
        let N = parseFloat(timeInput.value);
        let adjustForInflation = inflationToggle.checked;
        let inflationRate = 0.06; // 6%

        if (isNaN(P) || isNaN(R) || isNaN(N) || P <= 0 || R <= 0 || N <= 0) return;

        let i = R / 12 / 100;
        let n = N * 12;

        let investedAmount = P * n;
        let M = P * ((Math.pow(1 + i, n) - 1) / i) * (1 + i);

        if (adjustForInflation) {
            M = M / Math.pow(1 + inflationRate, N);
        }

        let estReturns = M - investedAmount;

        // Animate numbers
        animateValue(investedAmountEl, prevInvested, investedAmount, 600);
        animateValue(estReturnsEl, prevReturns, estReturns, 600);
        animateValue(totalValueEl, prevTotal, M, 600);

        prevInvested = investedAmount;
        prevReturns = estReturns;
        prevTotal = M;

        // Milestone Logic
        let milestoneTarget = currentCurrency.locale === 'en-IN' ? 10000000 : 1000000;
        let milestoneText = currentCurrency.locale === 'en-IN' ? '1 Crore' : '1 Million';
        
        if (M >= milestoneTarget) {
            let targetYears = 0;
            for(let j = 1; j <= N; j++) {
                let tempM = P * ((Math.pow(1 + i, j*12) - 1) / i) * (1 + i);
                if (adjustForInflation) tempM = tempM / Math.pow(1 + inflationRate, j);
                if(tempM >= milestoneTarget) { targetYears = j; break; }
            }
            milestoneBox.style.display = 'block';
            milestoneBox.innerText = `🎉 You will cross ${currentCurrency.symbol}${milestoneText} in Year ${targetYears}!`;
            
            if (!hasShownConfetti && typeof confetti === 'function') {
                confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
                hasShownConfetti = true;
            }
        } else {
            milestoneBox.style.display = 'none';
            hasShownConfetti = false;
        }

        // Generate Chart & Table Data
        let labels = [];
        let projectionData = [];
        let investedData = [];
        let tableHTML = '';

        for (let j = 1; j <= N; j++) {
            labels.push(`Yr ${j}`);
            let inv_j = P * 12 * j;
            investedData.push(inv_j);
            
            let n_j = j * 12;
            let M_j = P * ((Math.pow(1 + i, n_j) - 1) / i) * (1 + i);
            if (adjustForInflation) {
                M_j = M_j / Math.pow(1 + inflationRate, j);
            }
            projectionData.push(M_j);
            
            let return_j = M_j - inv_j;

            tableHTML += `<tr>
                <td style="text-align: left;">Year ${j}</td>
                <td>${currentCurrency.symbol} ${formatCurrency(inv_j)}</td>
                <td style="color: var(--primary);">${currentCurrency.symbol} ${formatCurrency(Math.max(0, return_j))}</td>
                <td style="font-weight: 600;">${currentCurrency.symbol} ${formatCurrency(M_j)}</td>
            </tr>`;
        }
        
        document.querySelector('#dataTable tbody').innerHTML = tableHTML;

        updateChart(labels, projectionData, investedData);
        updateDoughnutChart(investedAmount, estReturns);
    }

    // Interactive Line Chart
    function updateChart(labels, projectionData, investedData) {
        const ctx = document.getElementById('sipChart').getContext('2d');
        const isDark = document.body.getAttribute('data-theme') === 'dark';
        const gridColor = isDark ? '#334155' : '#e5e7eb';
        const textColor = isDark ? '#94a3b8' : '#6b7280';
        const primaryColor = isDark ? '#3b82f6' : '#2563eb';
        const fillColor = isDark ? 'rgba(59, 130, 246, 0.15)' : 'rgba(37, 99, 235, 0.1)';

        if (sipChart) {
            sipChart.destroy();
        }

        sipChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: labels,
                datasets: [
                    {
                        label: 'Total Value',
                        data: projectionData,
                        borderColor: primaryColor,
                        backgroundColor: fillColor,
                        borderWidth: 3,
                        fill: true,
                        tension: 0.4,
                        pointRadius: 0,
                        pointHoverRadius: 6
                    },
                    {
                        label: 'Invested Amount',
                        data: investedData,
                        borderColor: isDark ? '#64748b' : '#9ca3af',
                        borderWidth: 2,
                        borderDash: [5, 5],
                        fill: false,
                        tension: 0.4,
                        pointRadius: 0
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                interaction: {
                    mode: 'index',
                    intersect: false,
                },
                plugins: {
                    legend: { display: false },
                    tooltip: {
                        backgroundColor: isDark ? '#1e293b' : '#ffffff',
                        titleColor: isDark ? '#f8fafc' : '#111827',
                        bodyColor: isDark ? '#cbd5e1' : '#4b5563',
                        borderColor: isDark ? '#334155' : '#e5e7eb',
                        borderWidth: 1,
                        padding: 12,
                        callbacks: {
                            label: function(context) {
                                return context.dataset.label + ': ' + currentCurrency.symbol + ' ' + formatCurrency(context.parsed.y);
                            }
                        }
                    }
                },
                scales: {
                    x: {
                        grid: { display: false },
                        ticks: { color: textColor, maxTicksLimit: 6 }
                    },
                    y: {
                        grid: { color: gridColor },
                        ticks: { 
                            color: textColor,
                            callback: function(value) {
                                return currentCurrency.symbol + formatCompact(value);
                            }
                        }
                    }
                }
            }
        });
    }

    function updateDoughnutChart(invested, returns) {
        const ctx = document.getElementById('doughnutChart').getContext('2d');
        const isDark = document.body.getAttribute('data-theme') === 'dark';
        const primaryColor = isDark ? '#3b82f6' : '#2563eb';
        const secondaryColor = isDark ? '#334155' : '#cbd5e1';

        // Ensure we don't pass negative returns if inflation is high
        let validReturns = returns > 0 ? returns : 0;

        if (donutChart) {
            donutChart.data.datasets[0].data = [invested, validReturns];
            donutChart.update();
            return;
        }

        donutChart = new Chart(ctx, {
            type: 'doughnut',
            data: {
                labels: ['Total Invested', 'Wealth Gained'],
                datasets: [{
                    data: [invested, validReturns],
                    backgroundColor: [secondaryColor, primaryColor],
                    borderWidth: 0,
                    hoverOffset: 4
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                cutout: '75%',
                plugins: {
                    legend: {
                        position: 'right',
                        labels: { color: isDark ? '#f8fafc' : '#111827', font: { size: 13, family: "'Inter', sans-serif" } }
                    },
                    tooltip: {
                        backgroundColor: isDark ? '#1e293b' : '#ffffff',
                        titleColor: isDark ? '#f8fafc' : '#111827',
                        bodyColor: isDark ? '#cbd5e1' : '#4b5563',
                        borderColor: isDark ? '#334155' : '#e5e7eb',
                        borderWidth: 1,
                        padding: 12,
                        callbacks: {
                            label: function(context) {
                                return context.label + ': ' + currentCurrency.symbol + ' ' + formatCurrency(context.parsed);
                            }
                        }
                    }
                }
            }
        });
    }

    // Initialize
    calculateSIP();
    
    // Update theme toggle listener to redraw slider backgrounds correctly
    themeToggle.addEventListener('change', () => {
        updateSliderFill(invSlider);
        updateSliderFill(rateSlider);
        updateSliderFill(timeSlider);
    });
</script>
</body>
</html>
